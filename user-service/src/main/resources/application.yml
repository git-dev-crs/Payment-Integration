server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true

  jwt:
    secret: ${JWT_SECRET:paypal-clone-super-secret-key-for-jwt-signing-minimum-64-chars-2026}


  cloud:
    compatibility-verifier:
      enabled: false



